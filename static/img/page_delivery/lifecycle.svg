<text x="28" y="188" font-size="12" font-weight="600" fill="#c24a17" letter-spacing="1.2">DELIVER THE CHANGE</text>
<g font-size="14" font-weight="600" fill="#241f1c" text-anchor="middle">
<rect x="28" y="50" width="150" height="62" rx="10" fill="#faf7f4" stroke="#e4ded8"/><text x="103" y="78">Draft</text><text x="103" y="98" font-size="11" font-weight="400" fill="#6e655e">your private edits</text>
<rect x="240" y="50" width="150" height="62" rx="10" fill="#faf7f4" stroke="#e4ded8"/><text x="315" y="78">Review</text><text x="315" y="98" font-size="11" font-weight="400" fill="#6e655e">a teammate approves</text>
<rect x="452" y="50" width="150" height="62" rx="10" fill="#fdf0ea" stroke="#e8622a"/><text x="527" y="78">Dev</text><text x="527" y="98" font-size="11" font-weight="400" fill="#c24a17">merged and current</text>
