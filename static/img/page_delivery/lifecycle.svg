<path d="M158 237H226M438 247H496" stroke="#6e655e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="28" y="312" font-size="11" fill="#8a8077">A rejected package ends its trip: fix in dev, cut a new package, start again at Staging.</text>
