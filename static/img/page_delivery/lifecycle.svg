<text x="560" y="140" font-size="11" fill="#6e655e">cut a package</text>
<g font-size="14" font-weight="600" fill="#241f1c" text-anchor="middle">
<rect x="28" y="206" width="130" height="62" rx="10" fill="#faf7f4" stroke="#e4ded8"/><text x="93" y="234">Package</text><text x="93" y="254" font-size="11" font-weight="400" fill="#6e655e">frozen snapshot</text>
<rect x="228" y="206" width="210" height="82" rx="10" fill="#faf7f4" stroke="#e4ded8"/><text x="333" y="230">Staging</text><text x="333" y="250" font-size="11" font-weight="400" fill="#6e655e">promote · run · approve</text><text x="333" y="268" font-size="11" font-weight="400" fill="#6e655e">staging hubs</text>
<rect x="498" y="206" width="234" height="82" rx="10" fill="#fdf0ea" stroke="#e8622a"/><text x="615" y="230">Production</text><text x="615" y="250" font-size="11" font-weight="400" fill="#c24a17">promote · run · approve by someone else</text><text x="615" y="268" font-size="11" font-weight="400" fill="#c24a17">approval releases it</text>
